services:
  postgres:
    image: postgres:16-alpine
    container_name: firmflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-firmflow_db}
      POSTGRES_USER: ${DB_USER:-firmflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-firmflow_password_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-firmflow_user} -d ${DB_NAME:-firmflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: firmflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: firmflow_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: firmflow_api
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - DB_NAME=${DB_NAME:-firmflow_db}
      - DB_USER=${DB_USER:-firmflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-firmflow_password_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: firmflow_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app
      - media_volume:/app/media
    environment:
      - DB_NAME=${DB_NAME:-firmflow_db}
      - DB_USER=${DB_USER:-firmflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-firmflow_password_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: firmflow_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../backend:/app
    environment:
      - DB_NAME=${DB_NAME:-firmflow_db}
      - DB_USER=${DB_USER:-firmflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-firmflow_password_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: firmflow_frontend
    restart: unless-stopped
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    container_name: firmflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
